name: SkinStudio
version: 1.0.0
main: pl.skinstudio.SkinStudio
api-version: '1.21'
description: Apply custom model skins to weapons and armor using tokens

commands:
  skinstudio:
    description: Otwiera GUI Skin Studio (lub panel admina z /skinstudio admin)
    usage: /skinstudio [admin]
    permission: skinstudio.use
  skintoken:
    description: Komendy administracyjne tokenów
    usage: /skintoken <give|giveremove|list|reload>
    permission: skinstudio.admin

permissions:
  skinstudio.use:
    description: Pozwala używać /skinstudio
    default: true
  skinstudio.admin:
    description: Pozwala używać /skinstudio admin i /skintoken
    default: op
