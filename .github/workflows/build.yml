name: Build SkinStudio

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install bell-hub-api
        run: |
          if git clone --depth 1 https://github.com/bellzeb123-glitch/bell-hub-api.git /tmp/bell-hub-api 2>/dev/null; then
            mvn -f /tmp/bell-hub-api/pom.xml install -DskipTests -B -q
          else
            git clone --depth 1 https://github.com/bellzeb123-glitch/BellHub.git /tmp/bellhub
            mvn -f /tmp/bellhub/bell-hub-api/pom.xml install -DskipTests -B -q
          fi

      - name: Build with Maven
        run: mvn package -q

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkinStudio
          path: target/SkinStudio-*.jar
