name: SkinStudio
version: 1.26.1.2
main: pl.skinstudio.SkinStudio
api-version: '1.21'
description: Apply custom model skins to weapons and armor using tokens
softdepend: [BellHub]

commands:
  skinstudio:
    description: Opens the Skin Studio GUI (or admin panel with /skinstudio admin)
    usage: /skinstudio [admin]
    permission: skinstudio.use
    aliases: [ss]
  skintoken:
    description: Admin token management commands
    usage: /skintoken <give|giveremove|list|scan|convert|importoraxen|normalize|build|apply|diagnose|reload|language>
    permission: skinstudio.admin

permissions:
  skinstudio.use:
    description: Allows using /skinstudio
    default: true
  skinstudio.admin:
    description: Allows using /skinstudio admin and /skintoken
    default: op
  bellhub.module.skinstudio:
    description: BellHub panel — SkinStudio module
    default: op
