# ============================================================
#  SkinStudio - Konfiguracja
# ============================================================

# Language: en | pl
language: en

# ============================================================
#  Tier tabs for the admin GUI
#  Each tier auto-collects skins whose ID starts with "<tier-id>_"
#  Order in this list = order of tabs in the GUI
# ============================================================
tiers:
  bronze:
    display-name: "&6Bronze"
    material: ORANGE_STAINED_GLASS_PANE
  living:
    display-name: "&aLiving"
    material: LIME_STAINED_GLASS_PANE
  corrupted:
    display-name: "&5Corrupted"
    material: PURPLE_STAINED_GLASS_PANE
  palladium:
    display-name: "&bPalladium"
    material: CYAN_STAINED_GLASS_PANE
  ultimatium:
    display-name: "&eUltimatium"
    material: YELLOW_STAINED_GLASS_PANE
  craftenmine:
    display-name: "&6FMM"
    material: BLAZE_ROD
  dark_queen:
    display-name: "&5Dark Queen"
    material: PURPLE_STAINED_GLASS_PANE

# Special skins shown on the "Unique" tab (comma-separated IDs)
unique-skins:
  - frost_palace_fire_sword
  - frost_palace_ice_sword
  - primis_gladius_sword
  - magmaguys_toothpick

change-token:
  display-name: "&6✦ Token Zmiany"
  material: NETHER_STAR
  lore:
    - "&7Wymagany do nałożenia"
    - "&7lub zdjęcia skina."

skin-token-material: PAPER

# ============================================================
#  Konwerter skinów — „kupiłem pack → wrzucam → gotowe”
#  Wrzuć ZIP lub folder z assets/ do inbox/ — reszta automatycznie:
#    normalizacja → rozpoznanie skinów → config.yml → tier → build pack → RPM reload
# ============================================================
converter:
  enabled: true
  process-on-startup: true
  poll-interval-ticks: 200
  rebuild-after-import: false
  auto-tier: true
  isolate-item-models: false
  include-namespace-assets: true
  include-iainternal: true
  bundle-only: true              # tylko foldery z skin.yml (nie całe ZIP-y sklepów)
  bundle-only-staging: true      # builder czyta wyłącznie *.bundle.zip ze staging
  clean-legacy-staging-on-bundle: true
  inbox-folder: inbox
  staging-folder: staging
  output-folder: pack
  processed-folder: processed
  failed-folder: failed

# ============================================================
#  Skaner resource packów (/skintoken scan)
#  Przed skanem automatycznie naprawia typowe błędy kupowanych ZIP-ów:
#    - backslash w ścieżkach (Windows) → forward slash (wymagane przez MC)
#    - brak pack.mcmeta → dodaje domyślny (pack-format poniżej)
#  Po normalizacji SkinStudio przeładowuje RPM automatycznie (fallback: /resourcepackmanager reload).
#
#  Obsługiwane formaty:
#    - FMM:        assets/freeminecraftmodels/items/display/*.json
#    - EliteMobs:  assets/<ns>/items/gear/*.json
#    - ItemAdder modern (po /iazip + RPM merge):
#                  assets/<namespace>/items/**/*.json
#                  assets/<namespace>/equipment/*.json  → equipment-asset (zbroje)
#    - Inne packi MC 1.21.4+ item_model: assets/<namespace>/items/**/*.json
#
#  ItemAdder legacy CustomModelData NIE jest wspierany — użyj /iazip (modern) lub konwerter (roadmap).
#  Pack ItemAdder MUSI być w mixerze RPM. Namespace _iainternal zawsze wykluczony.
# ============================================================
scanner:
  mixer-folder: ResourcePackManager/mixer
  auto-normalize: true          # napraw ZIP-y w mixerze przed skanem (ścieżki + pack.mcmeta)
  normalize-backup: true        # kopia .zip.bak przy pierwszej normalizacji
  pack-format: 84               # Purpur/MC 26.1.x (było 46 = tylko 1.21.4 — powodowało szachownicę)
  auto-rpm-reload: true         # po buildzie: RPM reload (API lub komenda)
  push-after-reload: true       # po reload RPM: wyślij pack do graczy online (CDN cache)
  push-delay-ticks: 80          # opóźnienie push (~4s) — RPM musi skończyć upload
  rpm-reload-command: resourcepackmanager reload
  auto-build-pack: false        # Oraxen/RPM buduja pack — SkinStudio tylko tokeny
  excluded-namespaces:
    - freeminecraftmodels   # obsługiwane osobną ścieżką (items/display/)
    - elitemobs             # obsługiwane osobną ścieżką (items/gear/)
    - minecraft
    - _iainternal           # ItemAdder — wewnętrzne assety; dodaj własne namespace IA tutaj
  namespace-display:
    dark_queen: "Dark Queen"
    # myitems: "My Items"

